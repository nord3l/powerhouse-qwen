name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: shellcheck
        run: shellcheck install.sh .opencode/hooks/*.sh .opencode/bin/select-reviewers .opencode/bin/powerhouse-doctor tests/run.sh

      - name: tests
        run: tests/run.sh

      - name: approved Terraform modules
        run: .opencode/hooks/check-module-sources.sh .
